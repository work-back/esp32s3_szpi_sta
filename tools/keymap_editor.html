<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FPS 触摸键位编辑器</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    body { margin: 0; background: #17191d; color: #edf0f5; }
    main { display: grid; grid-template-columns: 320px minmax(0, 1fr); min-height: 100vh; }
    aside { padding: 18px; background: #22262c; border-right: 1px solid #3a4049; overflow: auto; }
    h1 { margin: 0 0 16px; font-size: 20px; }
    h2 { font-size: 15px; margin: 20px 0 8px; border-top: 1px solid #333842; padding-top: 14px; }
    label { display: block; margin: 9px 0; font-size: 13px; color: #cbd2dc; }
    label.checkbox-label { display: flex; align-items: center; gap: 8px; cursor: pointer; }
    label.checkbox-label input[type="checkbox"] { width: auto; margin: 0; }
    input, select, button { box-sizing: border-box; font: inherit; }
    input, select { width: 100%; margin-top: 4px; padding: 7px; border: 1px solid #515968; border-radius: 4px; background: #15181d; color: inherit; }
    button { padding: 8px 10px; border: 0; border-radius: 4px; color: white; background: #2e78d3; cursor: pointer; }
    button:hover { background: #3b8ce9; } button.danger { background: #923e49; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .toolbar { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 14px; }
    #zones { padding: 0; list-style: none; }
    #zones li { display: grid; grid-template-columns: 1fr auto; gap: 7px; padding: 8px; margin-bottom: 6px; background: #181b20; border-radius: 4px; font-size: 12px; }
    #canvas-wrap { display: grid; place-items: center; padding: 24px; overflow: auto; }
    canvas { max-width: 100%; max-height: calc(100vh - 48px); box-shadow: 0 2px 16px #000; cursor: crosshair; background: repeating-conic-gradient(#343a43 0 25%, #2a3038 0 50%) 50% / 24px 24px; }
    .hint { color: #aeb8c5; font-size: 12px; line-height: 1.45; }
    @media (max-width: 720px) { main { grid-template-columns: 1fr; } aside { border-right: 0; border-bottom: 1px solid #3a4049; } }
  </style>
</head>
<body>
<main>
  <aside>
    <h1>FPS 触摸键位编辑器</h1>
    <input id="image" type="file" accept="image/*" hidden>
    <button id="select-image" type="button">选择游戏截图</button>
    <p id="image-name" class="hint">也可以将图片文件拖到右侧画布。</p>
    <div class="row">
      <label>屏幕宽度<input id="screen-width" type="number" min="1" value="1080"></label>
      <label>屏幕高度<input id="screen-height" type="number" min="1" value="2400"></label>
    </div>

    <h2>全局摇杆释放按键</h2>
    <label>松开左摇杆按键（逗号分隔）<input id="global-rel-mov" placeholder="KEY_TAB, KEY_M" value="KEY_TAB"></label>
    <label>松开右摇杆按键（逗号分隔）<input id="global-rel-look" placeholder="KEY_TAB, KEY_M" value="KEY_TAB"></label>

    <h2>新建区域</h2>
    <label>用途<select id="kind">
      <option value="movement_joystick">左侧移动摇杆（WASD）</option>
      <option value="look_joystick">右侧视角摇杆（鼠标）</option>
      <option value="key">按键触点</option>
    </select></label>
    <label>形状<select id="shape"><option value="circle">圆形</option><option value="rect">方形</option></select></label>
    <datalist id="key-presets">
      <option value="BTN_LEFT">鼠标左键（开火/射击）</option>
      <option value="BTN_RIGHT">鼠标右键（开镜/瞄准）</option>
      <option value="BTN_MIDDLE">鼠标中键</option>
      <option value="KEY_SPACE">空格键（跳跃）</option>
      <option value="KEY_LEFTSHIFT">左Shift（冲刺/加速）</option>
      <option value="KEY_LEFTCTRL">左Ctrl（静步/下蹲）</option>
      <option value="KEY_C">C键（蹲下）</option>
      <option value="KEY_Z">Z键（趴下）</option>
      <option value="KEY_R">R键（换弹）</option>
      <option value="KEY_F">F键（拾取/交互）</option>
      <option value="KEY_TAB">Tab键（背包/地图）</option>
      <option value="KEY_M">M键（地图）</option>
      <option value="KEY_1">1键（主武器）</option>
      <option value="KEY_2">2键（副武器）</option>
      <option value="KEY_3">3键（投掷物）</option>
      <option value="KEY_4">4键（药品/道具）</option>
    </datalist>
    <label id="key-field">绑定按键（Linux input 名称）<input id="key" list="key-presets" value="BTN_LEFT" placeholder="BTN_LEFT / KEY_SPACE"></label>
    <label id="dead-field">死区（摇杆半径 %）<input id="dead-percent" type="number" min="0" max="90" value="10"></label>
    <label id="max-field">最大偏移（摇杆半径 %）<input id="max-percent" type="number" min="1" max="100" value="100"></label>
    <label id="random-field">随机范围（按键区域中心向四周 %）<input id="random-percent" type="number" min="0" max="100" value="60"></label>
    <div id="key-release-options">
      <label class="checkbox-label"><input id="key-rel-mov" type="checkbox">按下时松开左摇杆（WASD）</label>
      <label class="checkbox-label"><input id="key-rel-look" type="checkbox">按下时松开右摇杆（鼠标视角）</label>
    </div>
    <p class="hint">在右侧拖拽创建区域。左摇杆移动、右摇杆视角、按键独立触发。</p>

    <h2>已配置区域</h2>
    <ul id="zones"></ul>
    <section id="zone-editor" hidden>
      <h2>编辑选中区域</h2>
      <div class="row"><label>X<input id="edit-x" type="number"></label><label>Y<input id="edit-y" type="number"></label></div>
      <div class="row"><label id="edit-width-label">宽度<input id="edit-width" type="number" min="1"></label><label id="edit-height-label">高度<input id="edit-height" type="number" min="1"></label></div>
      <label id="edit-dead-field">死区（摇杆半径 %）<input id="edit-dead" type="number" min="0" max="90"></label>
      <label id="edit-max-field">最大偏移（摇杆半径 %）<input id="edit-max" type="number" min="1" max="100"></label>
      <label id="edit-random-field">随机范围（按键区域 %）<input id="edit-random" type="number" min="0" max="100"></label>
      <label id="edit-key-field">绑定按键<input id="edit-key" list="key-presets" placeholder="BTN_LEFT / KEY_SPACE"></label>
      <div id="edit-release-options">
        <label class="checkbox-label"><input id="edit-rel-mov" type="checkbox">按下时松开左摇杆（WASD）</label>
        <label class="checkbox-label"><input id="edit-rel-look" type="checkbox">按下时松开右摇杆（鼠标视角）</label>
      </div>
      <p class="hint">可在画布上直接拖拽调整已选区域位置。</p>
    </section>
    <div class="toolbar"><button id="export">导出 map.json</button><button id="clear" class="danger">清空区域</button></div>
    <p class="hint">触点槽位：左摇杆为 0，右摇杆为 1，按键触点（含射击按键）为 2。</p>
  </aside>
  <section id="canvas-wrap"><canvas id="canvas" width="1080" height="2400" aria-label="截图标注画布"></canvas></section>
</main>
<script>
(() => {
  const canvas = document.querySelector('#canvas'), ctx = canvas.getContext('2d');
  const widthInput = document.querySelector('#screen-width'), heightInput = document.querySelector('#screen-height');
  const globalRelMov = document.querySelector('#global-rel-mov'), globalRelLook = document.querySelector('#global-rel-look');
  const selectImageButton = document.querySelector('#select-image'), imageInput = document.querySelector('#image'), imageName = document.querySelector('#image-name');
  const kindInput = document.querySelector('#kind');
  const shapeInput = document.querySelector('#shape');
  const keyInput = document.querySelector('#key');
  const randomInput = document.querySelector('#random-percent');
  const deadInput = document.querySelector('#dead-percent'), maxInput = document.querySelector('#max-percent');
  const keyField = document.querySelector('#key-field');
  const keyReleaseOptions = document.querySelector('#key-release-options');
  const keyRelMov = document.querySelector('#key-rel-mov'), keyRelLook = document.querySelector('#key-rel-look');
  const deadField = document.querySelector('#dead-field'), maxField = document.querySelector('#max-field'), randomField = document.querySelector('#random-field');
  const zonesList = document.querySelector('#zones');
  const editor = document.querySelector('#zone-editor');
  const editX = document.querySelector('#edit-x'), editY = document.querySelector('#edit-y');
  const editWidth = document.querySelector('#edit-width'), editHeight = document.querySelector('#edit-height');
  const editRandom = document.querySelector('#edit-random'), editKey = document.querySelector('#edit-key');
  const editDead = document.querySelector('#edit-dead'), editMax = document.querySelector('#edit-max');
  const editRelMov = document.querySelector('#edit-rel-mov'), editRelLook = document.querySelector('#edit-rel-look');
  const editReleaseOptions = document.querySelector('#edit-release-options');
  const editWidthLabel = document.querySelector('#edit-width-label'), editHeightLabel = document.querySelector('#edit-height-label');
  const editKeyField = document.querySelector('#edit-key-field');
  const editDeadField = document.querySelector('#edit-dead-field'), editMaxField = document.querySelector('#edit-max-field'), editRandomField = document.querySelector('#edit-random-field');
  let zones = [], selectedIndex = -1, image = null, dragStart = null, preview = null, moving = null;
  const colors = { movement_joystick: '#38bdf8', look_joystick: '#a78bfa', key: '#fb923c' };
  const labels = { movement_joystick: '左侧移动（WASD）', look_joystick: '右侧视角（鼠标）', key: '按键' };
  function clamp(val, min, max) { return Math.max(min, Math.min(max, val)); }
  function screenSize() { return { width: Math.max(1, +widthInput.value || 1080), height: Math.max(1, +heightInput.value || 2400) }; }
  function fitCanvas() { const size = screenSize(); canvas.width = size.width; canvas.height = size.height; draw(); }
  function canvasPoint(event) { const rect = canvas.getBoundingClientRect(); return { x: (event.clientX - rect.left) * (canvas.width / rect.width), y: (event.clientY - rect.top) * (canvas.height / rect.height) }; }
  function drawZone(zone, previewMode = false) {
    ctx.save(); ctx.lineWidth = previewMode ? 2 : 3; ctx.strokeStyle = colors[zone.kind]; ctx.fillStyle = colors[zone.kind] + (previewMode ? '22' : '33');
    if (zone.shape === 'circle') { ctx.beginPath(); ctx.arc(zone.x, zone.y, zone.radius, 0, Math.PI * 2); ctx.fill(); ctx.stroke(); }
    else { ctx.fillRect(zone.x, zone.y, zone.width, zone.height); ctx.strokeRect(zone.x, zone.y, zone.width, zone.height); }
    const textX = zone.shape === 'circle' ? zone.x - zone.radius : zone.x; const textY = zone.shape === 'circle' ? zone.y - zone.radius - 6 : zone.y - 6;
    ctx.font = `${Math.max(13, canvas.width / 45)}px sans-serif`; ctx.fillStyle = colors[zone.kind]; ctx.fillText(zone.kind === 'key' ? `${labels[zone.kind]}: ${zone.key}` : labels[zone.kind], textX, Math.max(16, textY));
    ctx.restore();
  }
  function draw() { ctx.clearRect(0, 0, canvas.width, canvas.height); if (image) ctx.drawImage(image, 0, 0, canvas.width, canvas.height); zones.forEach(drawZone); if (preview) drawZone(preview, true); }
  function normalizedShape(start, end, shape) { if (shape === 'circle') return { shape: 'circle', x: Math.round(start.x), y: Math.round(start.y), radius: Math.max(1, Math.round(Math.hypot(end.x - start.x, end.y - start.y))) }; const x = Math.min(start.x, end.x), y = Math.min(start.y, end.y), width = Math.max(1, Math.abs(end.x - start.x)), height = Math.max(1, Math.abs(end.y - start.y)); return { shape: 'rect', x: Math.round(x), y: Math.round(y), width: Math.round(width), height: Math.round(height) }; }
  function selectZone(index) { selectedIndex = index; syncEditor(); renderZones(); draw(); }
  function isJoystick(zone) { return zone.kind !== 'key'; }
  function syncEditor() { const zone = zones[selectedIndex]; editor.hidden = !zone; if (!zone) return; editX.value = Math.round(zone.x); editY.value = Math.round(zone.y); editRandom.value = zone.random_percent; editDead.value = zone.dead_zone_percent; editMax.value = zone.max_deflection_percent; editKeyField.hidden = zone.kind !== 'key'; editReleaseOptions.hidden = zone.kind !== 'key'; editRandomField.hidden = isJoystick(zone); editDeadField.hidden = editMaxField.hidden = !isJoystick(zone); editWidthLabel.firstChild.textContent = zone.shape === 'circle' ? '半径' : '宽度'; editHeightLabel.hidden = zone.shape === 'circle'; editWidth.value = Math.round(zone.shape === 'circle' ? zone.radius : zone.width); if (zone.shape !== 'circle') editHeight.value = Math.round(zone.height); editKey.value = zone.key || ''; editRelMov.checked = !!zone.release_movement; editRelLook.checked = !!zone.release_look; }
  function renderZones() { zonesList.replaceChildren(...zones.map((zone, index) => { const li = document.createElement('li'), text = document.createElement('span'), button = document.createElement('button'); if (index === selectedIndex) li.style.outline = `2px solid ${colors[zone.kind]}`; text.textContent = `${labels[zone.kind]}${zone.kind === 'key' ? ` (${zone.key})` : `，死区 ${zone.dead_zone_percent}% / 最大 ${zone.max_deflection_percent}%`}`; text.onclick = () => selectZone(index); button.textContent = '删除'; button.className = 'danger'; button.onclick = () => { zones.splice(index, 1); if (selectedIndex >= zones.length) selectedIndex = zones.length - 1; syncEditor(); renderZones(); draw(); }; li.append(text, button); return li; })); }
  function selectedZone() { return zones[selectedIndex]; }
  function applyEditor() { const zone = selectedZone(); if (!zone) return; zone.x = +editX.value || 0; zone.y = +editY.value || 0; zone.random_percent = clamp(+editRandom.value || 0, 0, 100); zone.dead_zone_percent = clamp(+editDead.value || 0, 0, 90); zone.max_deflection_percent = clamp(+editMax.value || 1, 1, 100); if (zone.shape === 'circle') zone.radius = Math.max(1, +editWidth.value || 1); else { zone.width = Math.max(1, +editWidth.value || 1); zone.height = Math.max(1, +editHeight.value || 1); } if (zone.kind === 'key') { zone.key = editKey.value.trim(); zone.release_movement = editRelMov.checked; zone.release_look = editRelLook.checked; } renderZones(); draw(); }
  function hitTest(zone, point) { return zone.shape === 'circle' ? Math.hypot(point.x - zone.x, point.y - zone.y) <= zone.radius : point.x >= zone.x && point.x <= zone.x + zone.width && point.y >= zone.y && point.y <= zone.y + zone.height; }
  function syncKind() { const key = kindInput.value === 'key'; keyField.hidden = !key; keyReleaseOptions.hidden = !key; randomField.hidden = !key; deadField.hidden = maxField.hidden = key; }
  function loadImage(file) { if (!file || !file.type.startsWith('image/')) return; imageName.textContent = `已加载：${file.name}`; const reader = new FileReader(); reader.onload = () => { image = new Image(); image.onload = draw; image.src = reader.result; }; reader.readAsDataURL(file); }
  selectImageButton.onclick = () => imageInput.click();
  imageInput.onchange = () => loadImage(imageInput.files[0]);
  canvas.addEventListener('dragover', event => { event.preventDefault(); canvas.style.outline = '3px dashed #38bdf8'; });
  canvas.addEventListener('dragleave', () => { canvas.style.outline = ''; });
  canvas.addEventListener('drop', event => { event.preventDefault(); canvas.style.outline = ''; loadImage(event.dataTransfer.files[0]); });
  widthInput.onchange = heightInput.onchange = fitCanvas; kindInput.onchange = syncKind;
  canvas.onpointerdown = event => { const point = canvasPoint(event); const hit = [...zones.keys()].reverse().find(index => hitTest(zones[index], point)); canvas.setPointerCapture(event.pointerId); if (hit !== undefined) { selectZone(hit); moving = { point, zone: { ...zones[hit] } }; } else dragStart = point; };
  function newZone(point) { return { kind: kindInput.value, key: keyInput.value.trim(), release_movement: keyRelMov.checked, release_look: keyRelLook.checked, random_percent: clamp(+randomInput.value || 0, 0, 100), dead_zone_percent: clamp(+deadInput.value || 0, 0, 90), max_deflection_percent: clamp(+maxInput.value || 100, 1, 100), ...normalizedShape(dragStart, point, shapeInput.value) }; }
  canvas.onpointermove = event => { const point = canvasPoint(event); if (moving) { const zone = zones[selectedIndex]; zone.x = moving.zone.x + point.x - moving.point.x; zone.y = moving.zone.y + point.y - moving.point.y; syncEditor(); draw(); return; } if (!dragStart) return; preview = newZone(point); draw(); };
  function finishPointer(event) { if (moving) { moving = null; renderZones(); draw(); return; } if (!dragStart) return; const zone = newZone(canvasPoint(event)); dragStart = preview = null; if (zone.kind === 'key' && !zone.key) { draw(); return; } zones.push(zone); selectZone(zones.length - 1); }
  canvas.onpointerup = finishPointer; canvas.onpointercancel = finishPointer;
  [editX, editY, editWidth, editHeight, editRandom, editDead, editMax, editKey].forEach(input => input.oninput = applyEditor);
  [editRelMov, editRelLook].forEach(input => input.onchange = applyEditor);
  document.querySelector('#clear').onclick = () => { zones = []; selectedIndex = -1; syncEditor(); renderZones(); draw(); };
  function parseKeyList(str) { return str.split(/[,，\s]+/).map(s => s.trim()).filter(Boolean); }
  document.querySelector('#export').onclick = () => {
    const size = screenSize();
    const map = {
      version: 2,
      screen: size,
      release_movement_keys: parseKeyList(globalRelMov.value),
      release_look_keys: parseKeyList(globalRelLook.value),
      movement_joystick: null,
      look_joystick: null,
      keys: []
    };
    const region = zone => zone.shape === 'circle'
      ? { shape: 'circle', x: Math.round(zone.x), y: Math.round(zone.y), radius: Math.round(zone.radius) }
      : { shape: 'rect', x: Math.round(zone.x), y: Math.round(zone.y), width: Math.round(zone.width), height: Math.round(zone.height) };
    for (const zone of zones) {
      if (zone.kind === 'movement_joystick') map.movement_joystick = { slot: 0, dead_zone_percent: zone.dead_zone_percent, max_deflection_percent: zone.max_deflection_percent, ...region(zone) };
      else if (zone.kind === 'look_joystick') map.look_joystick = { slot: 1, dead_zone_percent: zone.dead_zone_percent, max_deflection_percent: zone.max_deflection_percent, ...region(zone) };
      else {
        const keyItem = { slot: 2, key: zone.key, random_percent: zone.random_percent, ...region(zone) };
        if (zone.release_movement) keyItem.release_movement = true;
        if (zone.release_look) keyItem.release_look = true;
        map.keys.push(keyItem);
      }
    }
    const blob = new Blob([JSON.stringify(map, null, 2) + '\n'], { type: 'application/json' }); const link = document.createElement('a'); link.href = URL.createObjectURL(blob); link.download = 'map.json'; link.click(); URL.revokeObjectURL(link.href);
  };
  syncKind(); fitCanvas();
})();
</script>
</body>
</html>
